<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clause ledger · Workshop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/workshop.css" />
</head>
<body data-page="ledger">
<div id="cw-header"></div>
<main class="container py-4 py-lg-5">

  <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
    <div>
      <div class="kicker mb-2">Public book</div>
      <h1 class="fw-bold mb-0">Clause ledger</h1>
    </div>
    <a class="btn btn-gold" href="submit.html">Write a clause</a>
  </div>
  <div class="glass p-4">
    <div class="table-responsive">
      <table class="table">
        <thead><tr><th>ID</th><th>Article</th><th>Title</th><th>Author</th><th>Status</th><th>Yea</th><th>Nay</th></tr></thead>
        <tbody id="rows"><tr><td colspan="7" style="color:var(--muted)">Loading…</td></tr></tbody>
      </table>
    </div>
    <p class="small mb-0 mt-2" style="color:var(--muted)">Open a title to vote or seal. Newest clauses show first.</p>
  </div>

</main>
<div id="cw-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
<script src="js/abi.js"></script>
<script src="js/shell.js"></script>
<script src="js/record.js"></script>
</body>
</html>
