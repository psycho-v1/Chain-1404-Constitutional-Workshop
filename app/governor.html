<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Later Governor · Workshop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/workshop.css" />
</head>
<body data-page="governor">
<div id="cw-header"></div>
<main class="container py-4 py-lg-5">

  <div class="kicker mb-2">Read-only for builders</div>
  <h1 class="fw-bold">What a later Governor may consume</h1>
  <p style="color:var(--muted)">This workshop does not run a DAO. A future Governor contract may read the sealed hashes. It cannot edit them from this page.</p>
  <div class="row g-4">
    <div class="col-md-4"><div class="glass p-4 stat"><b data-k="sealed">—</b><span>Sealed clauses</span></div></div>
    <div class="col-md-4"><div class="glass p-4 stat"><b data-k="open">—</b><span>Still open</span></div></div>
    <div class="col-md-4"><div class="glass p-4"><div class="small" style="color:var(--muted)">Window</div><div data-k="window">—</div></div></div>
  </div>
  <div class="glass p-4 mt-4">
    <div class="small" style="color:var(--muted)">rollingRoot</div>
    <div class="mono" data-k="root">—</div>
  </div>

</main>
<div id="cw-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
<script src="js/abi.js"></script>
<script src="js/shell.js"></script>
<script src="js/record.js"></script>
</body>
</html>
